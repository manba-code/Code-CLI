<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="760" viewBox="0 0 1500 760">
  <rect width="1500" height="760" fill="white"/>
  <text x="750" y="44" text-anchor="middle" font-size="22" font-weight="bold" fill="#111" font-family="Noto Sans SC, Microsoft YaHei, sans-serif">SpecAgent 简历级 Mini Pilot - 角色与职责</text>

  <!-- 评测执行者 Actor，W=220 -->
  <circle cx="60" cy="202" r="18" fill="none" stroke="#333" stroke-width="2"/>
  <line x1="60" y1="220" x2="60" y2="260" stroke="#333" stroke-width="2"/>
  <line x1="35" y1="238" x2="85" y2="238" stroke="#333" stroke-width="2"/>
  <line x1="60" y1="260" x2="38" y2="290" stroke="#333" stroke-width="2"/>
  <line x1="60" y1="260" x2="82" y2="290" stroke="#333" stroke-width="2"/>
  <text x="60" y="310" text-anchor="middle" font-size="14" fill="#222" font-family="Noto Sans SC, Microsoft YaHei, sans-serif">评测执行者</text>

  <!-- 执行域，子用例 y=100/180/260/340，中位数=220 -->
  <line x1="78" y1="220" x2="108" y2="220" stroke="#aaa" stroke-width="1.2"/>
  <ellipse cx="200" cy="220" rx="90" ry="32" fill="#7b5ea7" stroke="#7b5ea7" stroke-width="1.5"/>
  <text x="200" y="225" text-anchor="middle" font-size="13" fill="white" font-family="Noto Sans SC, Microsoft YaHei, sans-serif">自动评测域</text>

  <line x1="290" y1="220" x2="360" y2="100" stroke="#ccc" stroke-width="1"/>
  <line x1="290" y1="220" x2="360" y2="180" stroke="#ccc" stroke-width="1"/>
  <line x1="290" y1="220" x2="360" y2="260" stroke="#ccc" stroke-width="1"/>
  <line x1="290" y1="220" x2="360" y2="340" stroke="#ccc" stroke-width="1"/>

  <ellipse cx="460" cy="100" rx="100" ry="28" fill="#f8f8f8" stroke="#bbb" stroke-width="1.5"/>
  <text x="460" y="105" text-anchor="middle" font-size="13" fill="#222" font-family="Noto Sans SC, Microsoft YaHei, sans-serif">冻结模型与任务</text>
  <ellipse cx="460" cy="180" rx="100" ry="28" fill="#f8f8f8" stroke="#bbb" stroke-width="1.5"/>
  <text x="460" y="185" text-anchor="middle" font-size="13" fill="#222" font-family="Noto Sans SC, Microsoft YaHei, sans-serif">运行 A / B / C</text>
  <ellipse cx="460" cy="260" rx="100" ry="28" fill="white" stroke="#4a7fd4" stroke-width="1.5"/>
  <text x="460" y="265" text-anchor="middle" font-size="13" fill="#1a4a8a" font-family="Noto Sans SC, Microsoft YaHei, sans-serif">隔离人工评审材料</text>
  <ellipse cx="460" cy="340" rx="100" ry="28" fill="white" stroke="#4a7fd4" stroke-width="1.5"/>
  <text x="460" y="345" text-anchor="middle" font-size="13" fill="#1a4a8a" font-family="Noto Sans SC, Microsoft YaHei, sans-serif">揭示 Oracle 并评分</text>

  <!-- 人工评审者 Actor，W=540 -->
  <circle cx="60" cy="522" r="18" fill="none" stroke="#333" stroke-width="2"/>
  <line x1="60" y1="540" x2="60" y2="580" stroke="#333" stroke-width="2"/>
  <line x1="35" y1="558" x2="85" y2="558" stroke="#333" stroke-width="2"/>
  <line x1="60" y1="580" x2="38" y2="610" stroke="#333" stroke-width="2"/>
  <line x1="60" y1="580" x2="82" y2="610" stroke="#333" stroke-width="2"/>
  <text x="60" y="630" text-anchor="middle" font-size="14" fill="#222" font-family="Noto Sans SC, Microsoft YaHei, sans-serif">人工评审者</text>

  <!-- 评审域，子用例 y=460/540/620，中位数=540 -->
  <line x1="78" y1="540" x2="108" y2="540" stroke="#aaa" stroke-width="1.2"/>
  <ellipse cx="200" cy="540" rx="90" ry="32" fill="#3a7bd5" stroke="#3a7bd5" stroke-width="1.5"/>
  <text x="200" y="545" text-anchor="middle" font-size="13" fill="white" font-family="Noto Sans SC, Microsoft YaHei, sans-serif">人工验收域</text>

  <line x1="290" y1="540" x2="360" y2="460" stroke="#ccc" stroke-width="1"/>
  <line x1="290" y1="540" x2="360" y2="540" stroke="#ccc" stroke-width="1"/>
  <line x1="290" y1="540" x2="360" y2="620" stroke="#ccc" stroke-width="1"/>

  <ellipse cx="460" cy="460" rx="100" ry="28" fill="#fff8e6" stroke="#e07b00" stroke-width="1.5"/>
  <text x="460" y="465" text-anchor="middle" font-size="13" fill="#7a4a00" font-family="Noto Sans SC, Microsoft YaHei, sans-serif">审阅 Diff 与证据</text>
  <ellipse cx="460" cy="540" rx="100" ry="28" fill="#fff8e6" stroke="#e07b00" stroke-width="1.5"/>
  <text x="460" y="545" text-anchor="middle" font-size="13" fill="#7a4a00" font-family="Noto Sans SC, Microsoft YaHei, sans-serif">完成验收检查表</text>
  <ellipse cx="460" cy="620" rx="100" ry="28" fill="#fff8e6" stroke="#e07b00" stroke-width="1.5"/>
  <text x="460" y="625" text-anchor="middle" font-size="13" fill="#7a4a00" font-family="Noto Sans SC, Microsoft YaHei, sans-serif">冻结决定与人工时间</text>

  <!-- 二级结果 -->
  <line x1="560" y1="340" x2="600" y2="340" stroke="#ccc" stroke-width="1"/>
  <ellipse cx="700" cy="340" rx="100" ry="28" fill="white" stroke="#4a7fd4" stroke-width="1.5"/>
  <text x="700" y="337" text-anchor="middle" font-size="13" fill="#1a4a8a" font-family="Noto Sans SC, Microsoft YaHei, sans-serif">成功 / 误接受 /</text>
  <text x="700" y="353" text-anchor="middle" font-size="13" fill="#1a4a8a" font-family="Noto Sans SC, Microsoft YaHei, sans-serif">修复 / Scope 指标</text>

  <line x1="560" y1="620" x2="600" y2="620" stroke="#ccc" stroke-width="1"/>
  <ellipse cx="700" cy="620" rx="100" ry="28" fill="white" stroke="#4a7fd4" stroke-width="1.5"/>
  <text x="700" y="617" text-anchor="middle" font-size="13" fill="#1a4a8a" font-family="Noto Sans SC, Microsoft YaHei, sans-serif">A / C 人工验收</text>
  <text x="700" y="633" text-anchor="middle" font-size="13" fill="#1a4a8a" font-family="Noto Sans SC, Microsoft YaHei, sans-serif">时间对照</text>

  <!-- 最终结论 -->
  <line x1="800" y1="340" x2="840" y2="420" stroke="#ccc" stroke-width="1"/>
  <line x1="800" y1="620" x2="840" y2="420" stroke="#ccc" stroke-width="1"/>
  <ellipse cx="940" cy="420" rx="100" ry="28" fill="white" stroke="#4a7fd4" stroke-width="1.5"/>
  <text x="940" y="417" text-anchor="middle" font-size="13" fill="#1a4a8a" font-family="Noto Sans SC, Microsoft YaHei, sans-serif">形成可追溯的</text>
  <text x="940" y="433" text-anchor="middle" font-size="13" fill="#1a4a8a" font-family="Noto Sans SC, Microsoft YaHei, sans-serif">简历结论</text>

  <!-- 图例 -->
  <rect x="1100" y="70" width="300" height="245" rx="8" fill="white" stroke="#ccc" stroke-width="1.2"/>
  <text x="1250" y="100" text-anchor="middle" font-size="14" font-weight="bold" fill="#222" font-family="Noto Sans SC, Microsoft YaHei, sans-serif">图例</text>
  <ellipse cx="1190" cy="135" rx="70" ry="22" fill="#f8f8f8" stroke="#bbb" stroke-width="1.5"/>
  <text x="1190" y="140" text-anchor="middle" font-size="12" fill="#222" font-family="Noto Sans SC, Microsoft YaHei, sans-serif">已有能力</text>
  <ellipse cx="1190" cy="185" rx="70" ry="22" fill="white" stroke="#4a7fd4" stroke-width="1.5"/>
  <text x="1190" y="190" text-anchor="middle" font-size="12" fill="#1a4a8a" font-family="Noto Sans SC, Microsoft YaHei, sans-serif">本次产出</text>
  <ellipse cx="1190" cy="235" rx="70" ry="22" fill="#fff8e6" stroke="#e07b00" stroke-width="1.5"/>
  <text x="1190" y="240" text-anchor="middle" font-size="12" fill="#7a4a00" font-family="Noto Sans SC, Microsoft YaHei, sans-serif">必须执行</text>
  <text x="1250" y="285" text-anchor="middle" font-size="12" fill="#555" font-family="Noto Sans SC, Microsoft YaHei, sans-serif">Oracle 只能在人工决定冻结后揭示</text>
</svg>
