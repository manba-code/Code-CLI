name: PaiChange container integration

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  container-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        suite: [m6b, m7a, m7b]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Run local-container suite
        run: ./docker/run-paichange-${{ matrix.suite }}-tests.sh
      - name: Upload sanitized Surefire reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: paichange-${{ matrix.suite }}-reports
          if-no-files-found: warn
          path: target/surefire-reports/
