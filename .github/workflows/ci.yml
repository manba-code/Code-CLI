name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  deterministic-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Quick regression
        run: mvn --batch-mode test -Pquick
      - name: Node Web regression
        run: node --test src/test/js/change-web-creation.test.cjs
      - name: Build executable JAR
        run: mvn --batch-mode package -DskipTests
      - name: Upload deterministic reports and JAR
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-results
          if-no-files-found: warn
          path: |
            target/surefire-reports/
            target/paicli-1.0-SNAPSHOT.jar
