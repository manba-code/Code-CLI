name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Deterministic release regression
        run: |
          mvn --batch-mode test -Pquick
          node --test src/test/js/change-web-creation.test.cjs
      - name: Build release JAR and checksum
        run: |
          mvn --batch-mode package -DskipTests
          cd target
          sha256sum paicli-1.0-SNAPSHOT.jar > paicli-1.0-SNAPSHOT.jar.sha256
      - name: Publish immutable GitHub Release assets
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            target/paicli-1.0-SNAPSHOT.jar
            target/paicli-1.0-SNAPSHOT.jar.sha256
